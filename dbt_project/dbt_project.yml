name: 'logistics_supply_chain'
version: '1.0.0'
config-version: 2

profile: 'logistics_supply_chain'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  logistics_supply_chain:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  logistics_supply_chain:
    +schema: raw
    +quote_columns: false
